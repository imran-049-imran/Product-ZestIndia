version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: product-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: productdb
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: product-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: productdb
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: ZmVzdEluZGlhSXRTZXJ2aWNlc1NlY3JldEtleUZvckpXVFRva2VuU2lnbmluZzIwMjY=
    ports:
      - "8080:8080"

volumes:
  mysql_data:
